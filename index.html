<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Skills Test</title>
    
    <style>
        #everything {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body {
            background-image: url(https://i.pinimg.com/736x/7e/ce/70/7ece707ead9e845225f41aa933512803.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #shop {
            background-color: rgba(240, 239, 239, 0.8);
            width: 450px;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            padding: 30px;
            border-radius: 50px;
        }

        #headtag {
            text-align: center;
        }

        h1 {
            font-weight: bolder;
            font-size: 30px;
            color: crimson;
        }

        h3 {
            font-weight: bolder;
            font-size: 25px;
            color: crimson;
        }

        h2 {
            color: crimson;
            font-size: 25px;
        }

        #menu {
            line-height: 1.8;
            text-align: left;
        }

        [type="button"] {
            background-color: white;
            color: crimson;
            border: 2px solid crimson;
            border-radius: 10px;
            padding: 8px 15px;
            margin: 10px;
            font-weight: bold;
        }

        #result {
            background-color: white;
            color: rgb(1, 1, 10);
            border: 2px solid crimson;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    
    <div id="everything">
        <div id="shop">

            <div id="headtag">
                <h1>Pastries and Desserts Shop</h1>
            </div>

            <div id="menu">
                <h3>Menu:</h3>
                <div class="container">
                    <label><input type="checkbox" value="120" id="item1">Affogato</label> <br>
                    <label><input type="checkbox" value="45" id="item2">Americano</label><br>
                    <label><input type="checkbox" value="40" id="item3"> Brewed Coffee</label><br>
                    <label><input type="checkbox" value="75" id="item4">Iced Caramel Macchiato</label><br>
                    <label><input type="checkbox" value="60" id="item5"> Steamed White Chocolate Milk</label><br>
                    <label><input type="checkbox" value="80" id="item6">Matcha Cheesecake </label><br>
                    <label><input type="checkbox" value="80" id="item7"> Blueberry Cheesecake</label><br>
                    <input type="button" py-click="OrderSummary" value="Add">
                </div>
            </div>

            <h2>RECEIPT DETAILS</h2>
            <div id="result">
                <p>Subtotal: ₱0.00</p>
                <p>Tax: ₱0.00</p>
                <p><b>Total: ₱0.00</b></p>
            </div>

        </div>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
